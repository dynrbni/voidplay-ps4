name: Validate and build
on:
  pull_request:
  push:
    branches: [main, 'codex/**', 'feature/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run verify:public
      - run: ./native/diagnostic/test-host.sh
      - run: sh framework/voidplay-native/tools/test-portable.sh
      - run: npm ci --prefix framework/ps4-react --ignore-scripts
      - run: npm --prefix framework/ps4-react run bundle
      - run: node --test framework/ps4-react/tests/layout.test.mjs framework/ps4-react/tests/store.test.mjs
      - run: python3 -B -m unittest discover -s framework/ps4-react/tests -p 'test_*.py'
